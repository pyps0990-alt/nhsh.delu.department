<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>登入 - 內中熱食部</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            padding: 2rem 2.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 100vh;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-group{
            margin-bottom: 1rem;
            position: relative;
        }

        .signin-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 60%;
            position: relative;
            left: 20%;
            top : 20px;
            padding: 0.7rem;
            background: var(--btn);
            color: var(--Button-text);
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: var(--textmain);
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>登入</h2>
        <form>
            <div class="signin-group">
                <label for="username">用戶名</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit">登入</button>
        </form>

        <h2>註冊</h2>
        <form>
            <div class="login-group">
                <label for="new-username">用戶名</label>
                <input type="text" id="new-username" name="new-username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="new-password">密碼</label>
                <input type="password" id="new-password" name="new-password" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm-password">確認密碼</label>
                <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
            </div>
            <button type="submit">註冊</button>
        </form>
    </div>
    <div class="container">
        <a href ="../index.html"><button style="color: black;position: fixed;left: 10px;bottom: 30px;top: auto;max-width: max-content; max-height: max-content;">返回首頁</button></a>
    </div>
</body>
</html>
