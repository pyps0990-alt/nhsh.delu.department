<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Document</title>
</head>
<body>
    <button id="toggleBtn" class="btn2">選單</button>
    <div id="list" class="list">
        <a href="html/cart.html" class="text" style="text-decoration: none;color: var(--Button-text);">線上訂單</a><br>
        <a href="html/about.html" class="text" style="text-decoration: none;color: var(--Button-text);">關於我們</a><br>
        <a href="html/order.html" class="text" style="text-decoration: none;color: var(--Button-text);">訂單監控</a><br>
        <a href="html/onlinecash.html" class="text" style="text-decoration: none;color: var(--Button-text);">儲值系統</a>
    </div>
</body>
</html>
<script>
    const btn = document.getElementById('toggleBtn');
    const list = document.getElementById('list');

    list.classList.add('hidden');

    let isOpen = false;

    btn.addEventListener('click', () => {
        if(isOpen){
            list.classList.remove('show');
            list .classList.add('hidden');
        }else{
            list.classList.remove('hidden');
            list.classList.add('show');
        }
        isOpen = !isOpen;
    });
</script>
