<html lang="zh-Hant">

    <!--網頁標籤-->

    <link rel="stylesheet" href="../css/style.css">
    <title>訂餐系統</title>
</head>
<body>
    <div class="hreo">
        <div class="container">
            <h1 class="inner">內湖高中熱食部</h1>
            <p>便宜好食物，歡迎訂購！</p>
    </div>
    <button id="toggleBtn" class="btn2">選單</button>
    <div id="list" class="list">
        <a href="../index.html" class="text" style="text-decoration: none;color: var(--Button-text);">首頁</a><br>
        <a href="html/about.html" class="text" style="text-decoration: none;color: var(--Button-text);">關於我們</a><br>

    <div class="container">
        <p>以下是訂購系統</p>
    </div>
</body>
</html>
<script>
    const btn = document.getElementById('toggleBtn');
    const list = document.getElementById('list');

    list.classList.add('hidden');

    let isOpen = false;

    btn.addEventListener('click', () => {
        if(isOpen){
            list.classList.remove('show');
            list .classList.add('hidden');
        }else{
            list.classList.remove('hidden');
            list.classList.add('show');
        }
        isOpen = !isOpen;
    });
</script>
